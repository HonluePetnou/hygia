# Intégration continue (section 13 du cahier) : lint, typecheck et tests de tout le monorepo
# sur chaque push et chaque demande de fusion. Aucun secret ni compte AWS requis.
name: CI

on:
  push:
    branches: [main, dev, 'feat/**', 'fix/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Service Agents : Python 3, bibliothèque standard seule.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
