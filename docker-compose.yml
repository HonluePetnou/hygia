# Environnement local HYGIA : base clinique + AWS simulé. Aucun compte AWS requis.
# Lancement : docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hygia-postgres
    environment:
      POSTGRES_USER: hygia
      POSTGRES_PASSWORD: hygia
      POSTGRES_DB: hygia
    ports:
      # 54320 : évite le conflit avec un autre PostgreSQL local sur 5432.
      - '${HYGIA_POSTGRES_PORT:-54320}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Bases des services (dossiers…), créées au premier démarrage.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hygia -d hygia']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: hygia-localstack
    environment:
      SERVICES: s3,sqs,sns,events,dynamodb,stepfunctions,kinesis,lambda
      AWS_DEFAULT_REGION: eu-west-3
    ports:
      - '4566:4566'
    volumes:
      - ./infra/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  localstack-data:
